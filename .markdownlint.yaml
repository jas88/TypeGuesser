# markdownlint rules this repository turns off. markdownlint-cli and editors read this file.
MD013: false # line length
MD033: false # inline HTML
MD041: false # first line must be a top-level heading

# CHANGELOG.md follows Keep a Changelog, which repeats "### Added", "### Changed" and "### Fixed"
# under every release, and the guides repeat headings such as "### Overview" and "### What You Get"
# under each API layer or migration level. Only flag a heading that repeats one of its siblings.
MD024: { siblings_only: true }
